# Host nginx vhost for the CV. HTTPS is terminated by Cloudflare Tunnel, so plain HTTP here.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name rdevs.fr;
  root /var/www/cv;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /cv.pdf {
    add_header Content-Disposition 'attachment; filename="Robin-Geral-CV.pdf"';
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
